<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Sky Express & Solution</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

  <header class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="text-2xl font-black text-slate-900 tracking-tight">SKY EXPRESS <span class="text-blue-600">&</span> SOLUTION</a>
      <a href="index.html" class="text-sm font-semibold text-slate-600 hover:text-blue-600">&larr; Back to Home</a>
    </div>
  </header>

  <main class="py-16 flex-grow">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <h1 class="text-3xl font-extrabold text-slate-900 mb-8 text-center">Get in Touch</h1>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
        <!-- Contact Information -->
        <div class="space-y-6">
          <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-start gap-4">
            <div class="text-blue-600 text-xl mt-1"><i class="fa-solid fa-location-dot"></i></div>
            <div>
              <h3 class="font-bold text-slate-900">Address</h3>
              <p class="text-slate-600 text-sm mt-1">Chow Kit, Kuala Lumpur, Malaysia</p>
            </div>
          </div>

          <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-start gap-4">
            <div class="text-emerald-600 text-xl mt-1"><i class="fa-brands fa-whatsapp"></i></div>
            <div>
              <h3 class="font-bold text-slate-900">WhatsApp & Phone</h3>
              <p class="text-slate-600 text-sm mt-1">8754081311</p>
              <a href="https://wa.me/8754081311" target="_blank" class="text-emerald-600 text-xs font-bold hover:underline">Start Chat &rarr;</a>
            </div>
          </div>

          <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex items-start gap-4">
            <div class="text-blue-600 text-xl mt-1"><i class="fa-solid fa-envelope"></i></div>
            <div>
              <h3 class="font-bold text-slate-900">Email</h3>
              <p class="text-slate-600 text-sm mt-1">skyexpresssolution@gmail.com</p>
            </div>
          </div>

          <!-- Embedded Map -->
          <div class="rounded-xl overflow-hidden border border-slate-200 h-64 bg-slate-200">
            <iframe
              title="Chow Kit Map"
              width="100%"
              height="100%"
              style="border:0"
              loading="lazy"
              src="https://maps.google.com/maps?q=Chow+Kit,+Kuala+Lumpur&t=&z=14&ie=UTF8&iwloc=&output=embed">
            </iframe>
          </div>
        </div>

        <!-- Quick Message Form -->
        <div class="bg-white p-8 rounded-xl border border-slate-200 shadow-sm">
          <h2 class="text-xl font-bold text-slate-900 mb-4">Send a Direct Enquiry</h2>
          <form class="space-y-4" onsubmit="event.preventDefault(); alert('Enquiry received. We will get back to you shortly.'); this.reset();">
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1">Your Name</label>
              <input type="text" required class="w-full border border-slate-300 rounded-lg p-3">
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1">Phone Number</label>
              <input type="tel" required class="w-full border border-slate-300 rounded-lg p-3">
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1">Message / Questions</label>
              <textarea required rows="4" class="w-full border border-slate-300 rounded-lg p-3"></textarea>
            </div>
            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-lg transition">Send Enquiry</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
