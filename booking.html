<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Service | Sky Express & Solution</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

  <header class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="text-2xl font-black text-slate-900 tracking-tight">SKY EXPRESS <span class="text-blue-600">&</span> SOLUTION</a>
      <a href="index.html" class="text-sm font-semibold text-slate-600 hover:text-blue-600">&larr; Back to Home</a>
    </div>
  </header>

  <main class="py-12 flex-grow">
    <div class="max-w-2xl mx-auto px-4 sm:px-6">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 sm:p-10">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-2">Request a Service Appointment</h1>
        <p class="text-slate-600 text-sm mb-8">Fill in your requirements below. Our team in Chow Kit, Kuala Lumpur will review your location and schedule to confirm the booking.</p>

        <form id="booking-form" class="space-y-6">
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1" for="service">Service Required *</label>
            <select id="service" required class="w-full border border-slate-300 rounded-lg p-3 bg-white focus:ring-2 focus:ring-blue-600">
              <option value="">Select a service</option>
              <option value="CCTV Camera">CCTV Camera</option>
              <option value="Door Access">Door Access</option>
              <option value="Alarm System">Alarm System</option>
              <option value="PC Assembly & OS Installation">PC Assembly & OS Installation</option>
              <option value="Web Application Development">Web Application Development</option>
              <option value="Web Page / Website Development">Web Page / Website Development</option>
            </select>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1" for="customer-name">Full Name *</label>
              <input type="text" id="customer-name" required class="w-full border border-slate-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-600" placeholder="Your name">
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1" for="customer-phone">Phone / WhatsApp *</label>
              <input type="tel" id="customer-phone" required class="w-full border border-slate-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-600" placeholder="e.g. 0123456789">
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1" for="service-address">Service Location / Address (Kuala Lumpur) *</label>
            <textarea id="service-address" required rows="2" class="w-full border border-slate-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-600" placeholder="Street, Building, Area"></textarea>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1" for="preferred-date">Preferred Date *</label>
              <input type="date" id="preferred-date" required class="w-full border border-slate-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-600">
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-1" for="preferred-time">Preferred Time Slot *</label>
              <select id="preferred-time" required class="w-full border border-slate-300 rounded-lg p-3 bg-white focus:ring-2 focus:ring-blue-600">
                <option value="">Select time</option>
                <option value="Morning (09:00 - 12:00)">Morning (09:00 - 12:00)</option>
                <option value="Afternoon (12:00 - 15:00)">Afternoon (12:00 - 15:00)</option>
                <option value="Late Afternoon (15:00 - 18:00)">Late Afternoon (15:00 - 18:00)</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1" for="requirement-details">Describe Requirement / Issue *</label>
            <textarea id="requirement-details" required rows="3" class="w-full border border-slate-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-600" placeholder="Details about the setup or issue..."></textarea>
          </div>

          <div class="flex items-start gap-2 pt-2">
            <input type="checkbox" id="consent" required class="mt-1">
            <label for="consent" class="text-xs text-slate-600">I agree that this is a booking request and an appointment will be verified and confirmed by Sky Express & Solution.</label>
          </div>

          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-lg transition">
            Submit Booking Request
          </button>
        </form>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
